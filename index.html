<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6eee1"><meta name="description" content="양머리 수건을 쓰고 잠깐 쉬어 가는 작은 3D 찜질방. 오늘도, 찜질중."><title>찜질중 — 오늘은 조금 느리게</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="header"><a class="brand" href="./" aria-label="찜질중 처음으로"><span class="brand-icon">♨</span> 찜질중<span class="brand-dot"></span></a><span class="tagline">오늘은 조금 느리게</span><button id="sound" class="quiet-button" aria-pressed="false" aria-label="찜질방 소리 켜기">소리 꺼짐 <span>♪</span></button></header>
<main>
<section class="room" aria-label="따뜻한 3D 찜질방">
<div class="room-caption"><span class="eyebrow">YOUR LITTLE WARM RETREAT</span><h1>아무것도 안 해도<br>괜찮은 시간.</h1><p>따끈한 바닥, 포근한 양머리.<br>오늘의 피로는 여기에 두고 가요.</p></div>
<div id="viewport" tabindex="0" role="application" aria-label="3D 찜질방. 바닥을 누르거나 방향키로 걸어요. 아래 버튼으로 쉬는 자세를 바꿔요."></div>
<div class="room-badge"><i></i> 황토방 <span>38°C</span></div><div class="scene-hint" id="hint">바닥을 톡 누르면 걸어가요 <span>↗</span></div>
<div class="loading" id="loading" role="status"><div class="loading-mark">♨</div><h2>방을 따뜻하게 데우는 중</h2><p>포근한 쉼을 준비하고 있어요.</p></div>
<div class="loading error" id="error" role="alert" hidden><div class="loading-mark">♨</div><h2>잠깐, 문이 잘 안 열리네요</h2><p id="error-message">3D 화면을 불러오지 못했어요. 다시 한 번 들어와 주세요.</p><button id="retry">다시 들어가기</button></div>
<noscript><div class="loading"><h2>JavaScript를 켜 주세요</h2><p>3D 찜질방을 이용하려면 JavaScript가 필요해요.</p></div></noscript>
</section>
<section class="controls" aria-label="캐릭터 꾸미기와 행동">
<div class="welcome"><span class="tiny-label">나의 작은 쉼표</span><h2 id="status" aria-live="polite">어서 와요, 푹 쉬다 가요.</h2><div class="outfits" role="group" aria-label="찜질복 색상"><span>오늘의 찜질복</span><button class="swatch peach active" data-color="peach" aria-label="살구색 찜질복" aria-pressed="true"></button><button class="swatch mint" data-color="mint" aria-label="민트색 찜질복" aria-pressed="false"></button><button class="swatch lilac" data-color="lilac" aria-label="라일락색 찜질복" aria-pressed="false"></button></div></div>
<div class="actions" role="group" aria-label="쉬는 방법">
<button data-action="stand" class="selected" aria-pressed="true"><span class="action-icon">♧</span><b>산책</b><small>사뿐사뿐</small></button><button data-action="sit" aria-pressed="false"><span class="action-icon">♨</span><b>앉기</b><small>따끈하게</small></button><button data-action="lie" aria-pressed="false"><span class="action-icon">☾</span><b>눕기</b><small>잠깐 눈 감기</small></button><button data-action="egg" aria-pressed="false"><span class="action-icon">🥚</span><b>계란</b><small>소소한 행복</small></button><button data-action="drink" aria-pressed="false"><span class="action-icon">🥤</span><b>식혜</b><small>시원한 한 모금</small></button>
</div></section>
</main><footer><span>몸도 마음도 말랑해지는 곳</span><span>잠시 쉬어가는 중 <i>✦</i></span></footer>
<script>
window.showRoomError = function(message) { document.querySelector('#loading').hidden = true; document.querySelector('#error').hidden = false; if(message) document.querySelector('#error-message').textContent = message; };
document.querySelector('#retry').addEventListener('click', () => location.reload());
window.roomLoadTimer = setTimeout(() => window.showRoomError('로딩이 조금 오래 걸리고 있어요. 연결을 확인한 뒤 다시 들어와 주세요.'), 20000);
import('./scene.js?v=plush-2').catch(error => { clearTimeout(window.roomLoadTimer); console.error(error); window.showRoomError(); });
</script></body></html>
