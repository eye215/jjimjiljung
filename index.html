<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>찜질중 ♨️</title><style>body{margin:0;background:#f8e6c6;font-family:system-ui;overflow:hidden}#scene{display:block;width:100vw;height:100vh}#hud{position:absolute;top:20px;left:18px;background:#fff9;padding:12px 16px;border-radius:20px;font-weight:bold;color:#78482c}#actions{position:absolute;bottom:35px;left:0;width:100%;display:flex;justify-content:center;gap:9px}button{background:#fff9;border:0;border-radius:22px;padding:14px;font-size:15px;box-shadow:0 3px 12px #8764}#note{position:absolute;bottom:105px;left:0;width:100%;text-align:center;color:#70472f;font-weight:bold}</style></head><body><div id="hud">♨️ 찜질중 <small>· 혼자서도 뜨끈하게</small></div><canvas id="scene"></canvas><div id="note">바닥을 터치하면 이동해요!</div><div id="actions"><button onclick="act('앉기')">🧘 앉기</button><button onclick="act('눕기')">💤 눕기</button><button onclick="act('계란')">🥚 계란</button><button onclick="act('식혜')">🥤 식혜</button></div><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let player={x:.5,y:.65,tx:.5,ty:.65,pose:'',until:0};const friends=Array.from({length:24},(_,i)=>({x:.12+(i%6)*.15,y:.25+Math.floor(i/6)*.12,color:['#f3b26a','#c4b5ed','#a5d7cb','#f6a9a5'][i%4],sleep:i%3===0}));function avatar(a,me=false){const px=a.x*W,py=a.y*H,s=Math.min(W/380,1.25)*(me?1.35:1);x.save();x.translate(px,py);x.scale(s,s);x.fillStyle='#71544333';x.beginPath();x.ellipse(0,5,22,7,0,0,7);x.fill();if(a.pose==='눕기'||a.sleep){x.rotate(-Math.PI/2)}x.fillStyle=a.color||'#f2b268';x.beginPath();x.roundRect(-15,-37,30,34,12);x.fill();x.fillStyle='#ffe0ba';x.beginPath();x.arc(0,-55,22,0,7);x.fill();x.fillStyle='#fff6e9';x.beginPath();x.roundRect(-24,-79,48,17,9);x.fill();for(let k of [-15,15]){x.beginPath();x.arc(k,-74,11,0,7);x.fill()}x.fillStyle='#5b463c';for(let k of [-7,7]){x.beginPath();x.arc(k,-57,2,0,7);x.fill()}x.strokeStyle='#b76b58';x.lineWidth=2;x.beginPath();x.arc(0,-51,4,0,Math.PI);x.stroke();x.restore()}function draw(t){x.clearRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e6b68e');g.addColorStop(.47,'#f6d4a3');g.addColorStop(1,'#c88e61');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#a66f4e';x.fillRect(0,H*.15,W,H*.06);x.fillStyle='#f3d6b1';x.fillRect(0,H*.21,W,H*.12);x.fillStyle='#b77b53';for(let i=0;i<15;i++)x.fillRect(0,H*.35+i*H*.045,W,2);x.fillStyle='#94593b';x.fillRect(W*.03,H*.17,W*.27,H*.13);x.fillRect(W*.7,H*.17,W*.27,H*.13);x.fillStyle='#fbdba5';x.font='bold 17px system-ui';x.fillText('🔥 불가마',W*.05,H*.25);x.fillText('🥤 매점',W*.73,H*.25);friends.forEach(a=>avatar(a));player.x+=(player.tx-player.x)*.065;player.y+=(player.ty-player.y)*.065;if(t>player.until)player.pose='';avatar(player,true);requestAnimationFrame(draw)}requestAnimationFrame(draw);c.addEventListener('pointerdown',e=>{player.tx=Math.max(.07,Math.min(.93,e.clientX/W));player.ty=Math.max(.4,Math.min(.86,e.clientY/H));player.pose=''});function act(v){player.pose=v;player.until=performance.now()+2300;document.querySelector('#note').textContent=v==='계란'?'🥚 톡! 맥반석 계란 냠냠':v==='식혜'?'🥤 캬~ 시원하다!':v==='눕기'?'💤 오늘도 고생했어요':'♨️ 잠깐 쉬었다 가요';setTimeout(()=>document.querySelector('#note').textContent='바닥을 터치하면 이동해요!',2300)}</script></body></html>
