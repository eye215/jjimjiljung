name: iOS simulator build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript syntax
        run: npm run check

      - name: Install pinned Capacitor dependencies
        run: |
          npm install --no-audit --no-fund --save-exact @capacitor/core@8.6.0 @capacitor/ios@8.6.0
          npm install --no-audit --no-fund --save-dev --save-exact @capacitor/cli@8.6.0

      - name: Package offline web content
        run: node tools/prepare-ios.mjs

      - name: Generate native iOS project
        run: npx cap add ios

      - name: Print available Xcode version
        run: xcodebuild -version

      - name: Build iOS Simulator app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Collect simulator .app bundle
        run: |
          APP_PATH="ios-build/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" jjimjiljung-ios-simulator.zip

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjimjiljung-ios-simulator
          path: jjimjiljung-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
